name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Architecture conventions guard (always runs) ─────────────────────────────
  # Enforces the machine-checkable rules in docs/07-SERVICE-CONVENTIONS.md so
  # cross-agent drift (e.g. services decoding JWTs) fails the build, not review.
  conventions:
    name: Conventions · architecture guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check service conventions
        run: python scripts/check_conventions.py

  # ── Infrastructure config guard (T309 / M24) ────────────────────────────────
  # Infra typos don't raise exceptions — they quietly deploy a service on the
  # wrong port or point Prometheus at nothing. This lane catches that here
  # instead of in production. It also proves the generated Dockerfiles/fly.toml
  # still match infra/services.yml, so nobody can hand-edit one out of sync.
  infra:
    name: Infra · registry · generated artifacts · monitoring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Verify generated artifacts match the registry
        run: python scripts/gen_infra.py --check

      - name: Infra config test suite
        run: python -m pytest tests/infra -q

  # ── Security invariants guard (T310 / M27) ──────────────────────────────────
  # Pins the invariants found broken during the security review: the gateway
  # tenant trust boundary, fail-closed production secrets, RLS role privileges,
  # SQL-injection surface, and committed credentials. Runs with no database and
  # no network so it can never silently skip — the silent-skip pattern in
  # tests/integration/test_postgres_rls.py is exactly how the RLS finding hid.
  security:
    name: Security · invariants · secrets · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Security invariant suite
        run: python -m pytest tests/security -q

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisory for now: the known highs are transitive through Next.js
      # (sharp/postcss) and need a framework upgrade rather than a direct bump,
      # so failing the build on them would just train people to ignore it.
      # Revisit once M-3 in docs/13-SECURITY-REVIEW-OWASP.md is closed.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level=high || true

  # ── JavaScript / TypeScript lane (web, api-gateway, packages/*) ──────────────
  js-ts:
    name: JS/TS · lint · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # ── Python lane (services/*) — activates once a service ships ────────────────
  python:
    name: Python · ruff · mypy · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python services
        id: detect
        run: |
          if ls services/*/pyproject.toml >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Python services yet — skipping (lane ready for T101+)."
          fi
      - name: Setup Python
        if: steps.detect.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        if: steps.detect.outputs.found == 'true'
        run: pipx install uv
      - name: Lint · Typecheck · Test
        if: steps.detect.outputs.found == 'true'
        run: |
          for svc in services/*/; do
            [ -f "$svc/pyproject.toml" ] || continue
            echo "::group::$svc"
            (cd "$svc" && uv sync --dev && uv run ruff check . && uv run mypy . && uv run pytest -q)
            echo "::endgroup::"
          done

      # Repo-root Python (T313). tests/ and scripts/ sit outside services/, so
      # no service pyproject.toml is an ancestor of them and the loop above
      # never linted a line of either — including tests/infra and
      # tests/security, which the infra and security jobs actually execute.
      # Governed by the repo-root ruff.toml; run with a pinned ruff so this
      # lane can't change verdict when a new release shifts default rules.
      - name: Lint repo-root tests/ and scripts/
        run: |
          pipx install 'ruff==0.16.1'
          ruff check tests scripts

  # ── Flutter lane (apps/mobile) — activates once the app ships ────────────────
  flutter:
    name: Flutter · analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Flutter app
        id: detect
        run: |
          if [ -f apps/mobile/pubspec.yaml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Flutter app yet — skipping (lane ready for T301)."
          fi
      - name: Setup Flutter
        if: steps.detect.outputs.found == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze · Test
        if: steps.detect.outputs.found == 'true'
        run: |
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test
