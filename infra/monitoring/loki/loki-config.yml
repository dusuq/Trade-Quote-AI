# TradeQuote AI — Loki (log aggregation) single-binary config (T309 / M24).
#
# Sized for the MVP: filesystem-backed, single process, no clustering. The
# scale path (S3 object store + separate read/write/backend targets) is noted in
# infra/monitoring/README.md — moving to it is a config change, not a rewrite.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Structured logs from Loki itself, so the log system's own logs are parseable.
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Contractors' devices and CI can push out-of-order lines; rejecting them
  # loses exactly the logs you want during an incident.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  # Guard rails so one chatty service cannot evict everyone else's logs.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  # PII/retention: 30 days is the default retention for application logs.
  retention_period: 720h

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  retention_enabled: true
  retention_delete_delay: 2h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true

analytics:
  # Don't phone home.
  reporting_enabled: false
