# pnpm workspace — JS/TS packages only.
# Python services (services/*) use uv/Poetry; Flutter app uses Melos — excluded here.
packages:
  - "apps/web"
  - "apps/api-gateway"
  - "packages/*"

# pnpm 10+ refuses to run a dependency's postinstall build script unless it is
# approved here, and `pnpm install --frozen-lockfile` exits 1 with
# ERR_PNPM_IGNORED_BUILDS rather than warning. These four need their native
# build steps: esbuild and sharp ship platform binaries, protobufjs generates
# code. Note this lives in pnpm-workspace.yaml, not package.json — pnpm 10.6+
# moved settings here, and the package.json field is silently ignored.
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
