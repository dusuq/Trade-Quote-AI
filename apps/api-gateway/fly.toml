# GENERATED by scripts/gen_infra.py from infra/services.yml — do not edit by hand.
#
# api-gateway — API Gateway / BFF — JWT verification, rate limiting, service routing
# Deploy:  fly deploy --config apps/api-gateway/fly.toml --app tradequote-api-gateway

app = "tradequote-api-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "production"

[http_service]
  internal_port = 8000
  # Public edge: redirect plaintext to TLS.
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Liveness/readiness. Fly pulls a machine out of rotation when this fails, so
# /health must stay dependency-light — it should answer even when a downstream
# is degraded, or one slow dependency will cascade into a full outage.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
