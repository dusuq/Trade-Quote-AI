[project]
name = "tradequote-auth-service"
version = "0.1.0"
description = "TradeQuote AI — Auth service (tenants, users, RBAC, JWT, MFA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43",
    "prometheus-fastapi-instrumentator>=7.0",
    # Imported directly by app/infrastructure/security_metrics.py (T310b), not
    # only transitively via the instrumentator above. Declared explicitly for
    # the same reason httpx was in T309b: a transitive dependency that a
    # sibling package could drop is not a dependency, it is a coincidence.
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.17",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["\\.venv", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
