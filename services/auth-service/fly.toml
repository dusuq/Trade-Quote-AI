# GENERATED by scripts/gen_infra.py from infra/services.yml — do not edit by hand.
#
# auth-service — Tenants, users, RBAC, JWT issuance, MFA
# Deploy:  fly deploy --config services/auth-service/fly.toml --app tradequote-auth-service

app = "tradequote-auth-service"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8001"
  APP_ENV = "production"

[http_service]
  internal_port = 8001
  # Internal-only: gateway reaches this over the private .internal network on http.
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 80

# Liveness/readiness. Fly pulls a machine out of rotation when this fails, so
# /health must stay dependency-light — it should answer even when a downstream
# is degraded, or one slow dependency will cascade into a full outage.
[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
